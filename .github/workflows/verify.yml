# Loop verify (loops/verify/LOOP.md): the final, full run of the project's checks on a clean machine.
# The job name "verify" is the required status check on main.
name: verify
on:
  pull_request:
  push:
    branches: [main]
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26.x"
          cache-dependency-path: "**/go.sum"
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Install pnpm
        run: npm install -g pnpm@12
      - name: Install golangci-lint (only when the project configures it)
        if: hashFiles('**/.golangci.yml', '**/.golangci.yaml', '**/.golangci.toml') != ''
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@latest && echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: verify (full)
        run: VERIFY_MODE=full python3 loops/verify/run .
