# Loop prod-guard (loops/prod-guard/LOOP.md): after Railway deploys main, check production; roll it back only
# when it is down (policy autonomy.production_rollback), and open an issue either way something is wrong.
# Triggered by Railway's commit status "brandy - app" on a main commit: Railway reports when the deploy ended, so
# nothing polls Railway, and no job holds a deploy back.
# RAILWAY_TOKEN is a Railway project token for the production environment only, kept in the GitHub environment
# "production", which only protected branches (main) can use.
name: prod-guard
on:
  status:
concurrency:
  group: prod-guard
  cancel-in-progress: false
permissions:
  contents: read
  issues: write
env:
  PROD_URL: https://app-production-fd86.up.railway.app
  RAILWAY_PROJECT_ID: 3eddf5a4-96dc-48ed-bfd6-79eefd880cd4
  RAILWAY_ENVIRONMENT_ID: d61d98df-d69f-426e-b166-a97a1ce20378
  RAILWAY_SERVICE_ID: 040325ef-6b8d-42dd-a916-0a0a53a2a9ee
jobs:
  prod-guard:
    # Railway's final status for a main commit; not pending, not a PR environment, not "no deployment needed".
    if: >-
      github.event.context == 'brandy - app' && github.event.state != 'pending' &&
      contains(github.event.branches.*.name, 'main') &&
      !startsWith(github.event.description, 'No deployment needed') &&
      !startsWith(github.event.description, 'Deployment cancelled')
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
      SHA: ${{ github.event.sha }}
      STATE: ${{ github.event.state }}
      DESCRIPTION: ${{ github.event.description }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.sha }}
      - name: What Railway reported
        run: |
          echo "prod-guard: Railway says '$STATE: $DESCRIPTION' for $SHA"
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Install the web app and Chromium
        working-directory: web
        run: |
          npm install -g pnpm@12
          pnpm install --frozen-lockfile
          pnpm exec playwright install --with-deps chromium
      - name: prod-guard
        id: guard
        run: |
          set +e
          loops/prod-guard/run "$PROD_URL" | tee guard.txt
          echo "code=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"
      - name: Roll back (production is down)
        if: steps.guard.outputs.code == '3'
        run: |
          python3 loops/prod-guard/railway.py rollback | tee -a guard.txt
          sleep 60
          PREVIEW_WAIT=300 loops/prod-guard/run "$PROD_URL" | tee -a guard.txt || true
      - name: Open an issue
        if: steps.guard.outputs.code != '0' || github.event.state != 'success'
        env:
          CODE: ${{ steps.guard.outputs.code }}
        run: |
          case "$CODE" in
            3) title="prod-guard: production was down after ${SHA::7}, rolled back" ;;
            1) title="prod-guard: smoke failed on production after ${SHA::7} (not rolled back)" ;;
            *) title="prod-guard: production deploy of ${SHA::7} failed; production still runs the previous one" ;;
          esac
          { echo "Commit: $SHA · Railway: $STATE: $DESCRIPTION · run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo; echo '```'; cat guard.txt 2>/dev/null; echo '```'; } > issue.md
          gh issue create --title "$title" --body-file issue.md
      - name: Fail the run when production is not fine
        if: steps.guard.outputs.code != '0'
        run: exit 1
