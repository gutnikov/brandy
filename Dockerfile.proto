# The prototype server for gate 1 (loops/prototype-gate): Railway service `proto`.
# It runs the ui-prototypes runner (Vite dev server) over web/prototypes/, so each PR environment serves its
# prototypes at <proto url>/<name>. Prototypes use fake data and make no API calls. Never part of the app image.
# It is a public dev server: the service holds no secrets (only PORT and RAILWAY_* variables), and its image
# holds only web/, whose source is public. Never add secrets to the proto service.
FROM node:22-alpine
RUN npm install -g pnpm@12
WORKDIR /src/web
COPY web/package.json web/pnpm-lock.yaml ./
RUN pnpm install --frozen-lockfile
COPY web/ ./
# Vite refuses requests for hosts it does not know (HTTP 403): Railway serves the service on *.up.railway.app and
# sends its healthcheck with the host healthcheck.railway.app.
ENV __VITE_ADDITIONAL_SERVER_ALLOWED_HOSTS=.up.railway.app,healthcheck.railway.app
CMD ["sh", "-c", "exec pnpm proto --host 0.0.0.0 --port \"${PORT:-6060}\" --strictPort"]
